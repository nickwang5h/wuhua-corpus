lesson:
  id: learning-from-others
  version: "1"
  title: A teacher beside you
  level: Starting
  goal: Recognise 人 (person) and 师 (teacher), and notice how learning can begin with the people around us.
  prerequisites: []
  intro: Who can we learn from? Look for 人 (person) and 师 (teacher) in this line about walking with others.
  refs:
    - id: p-lunyu-2177439-7-21
      version: "1"
      start: 4
      end: 14
      label: Analects · Shu Er
  exercises:
    - id: teacher-word
      type: meaning
      prompt: Which character means “teacher” in this line?
      options:
        - 人 (rén)
        - 行 (xíng)
        - 师 (shī)
      answer: 2
      feedback: 师 means “teacher”. 人 means “person”, and 行 is “walk” in this sentence; 我师 means “my teacher”.
    - id: teacher-context
      type: context
      prompt: Which action follows the wider passage’s idea of learning from others?
      options:
        - Copy everything someone does
        - Learn from good qualities and reflect on mistakes
        - Only learn from people with a formal title
      answer: 1
      feedback: "The following sentence makes a distinction: follow good qualities and use mistakes as a reason to examine oneself. Learning from someone is not the same as copying everything they do."
  reflection: Think of someone you learned from outside a classroom. What did you notice, and how did it change what you do? You may answer in English.
