lesson:
  id: practice-and-joy
  version: "1"
  title: Practice and joy
  level: Starting
  goal: Recognise 学 (learn) and 习 (practise), and understand the idea of returning to learning.
  prerequisites: []
  intro: Confucius asks about the pleasure of returning to what we learn; start with 学 (learn) and 习 (practise).
  refs:
    - id: p-lunyu-2058123-1-1
      version: "1"
      start: 4
      end: 15
      label: Analects 1.1
  exercises:
    - id: learn-word
      type: meaning
      prompt: Match 学 (xué) with its meaning.
      options:
        - Learn
        - Forget
        - Travel
      answer: 0
      feedback: 学 means “learn”. You met it at the start of the line. 习 (xí) is “practise”. Return to the words whenever you need help.
    - id: practice-idea
      type: context
      prompt: Which action fits the idea in this passage?
      options:
        - Read once and never return
        - Return to practise what you learned
        - Memorise without thinking
      answer: 1
      feedback: The line links learning with returning to practise. The final question presents that practice as a pleasure. 说 is read yuè here, meaning pleasure, not shuō (“speak”).
  reflection: What is one small thing you would like to practise again? You may answer in English or simply think about it.
