  wordsToNotice:
    id: knowing-enough-words
    target: p-laozi-2354026-33-1
    version: "1"
    start: 21
    end: 26
    text: 足 (zú) means “enough” here, and 知足 (zhī zú) means being content with enough. 富 (fù) means “rich”; 足 can also mean “foot”, but that is not its meaning in this phrase.
