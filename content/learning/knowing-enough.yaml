lesson:
  id: knowing-enough
  version: "1"
  title: What counts as enough?
  level: Starting
  goal: Recognise 足 (enough) and 富 (rich), and explore a different meaning of being rich.
  prerequisites: []
  intro: What makes someone rich? Explore how 知足 (knowing enough) changes the meaning of 富 (rich).
  refs:
    - id: p-laozi-2354026-33-1
      version: "1"
      start: 21
      end: 26
      label: Daodejing 33
  exercises:
    - id: enough-word
      type: meaning
      prompt: In 知足 (zhī zú), what does 足 mean?
      options:
        - Enough
        - Foot
        - Teacher
      answer: 0
      feedback: Here 足 means “enough”. Together, 知足 describes recognising enough and feeling content; the everyday meaning “foot” does not fit this phrase.
    - id: enough-context
      type: context
      prompt: What does this line connect with being rich?
      options:
        - Owning more than everyone else
        - Knowing when one has enough
        - Always getting more
      answer: 1
      feedback: The line connects 富, “rich”, with 知足, knowing enough. It invites us to consider contentment as a kind of richness, rather than a comparison of possessions.
  reflection: Think of one moment when something felt sufficient. What made it feel like enough? English is welcome; this is a personal reflection.
