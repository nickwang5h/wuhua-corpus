lesson:
  id: knowing-yourself
  version: "1"
  title: Knowing others, knowing yourself
  level: Starting
  goal: Recognise 知 (know) and 自 (self), and notice a contrast in a classical line.
  prerequisites: []
  intro: This line turns from knowing other people to knowing ourselves; look for 知 (know) and 自 (self).
  refs:
    - id: p-laozi-2354026-33-1
      version: "1"
      start: 0
      end: 10
      label: Daodejing 33
  exercises:
    - id: know-word
      type: meaning
      prompt: Which character means “know” in this line?
      options:
        - 知 (zhī)
        - 人 (rén)
        - 明 (míng)
      answer: 0
      feedback: 知 means “know”. 人 means “person”; 自知 directs knowing back toward oneself.
    - id: know-contrast
      type: context
      prompt: What is being compared?
      options:
        - Knowing others and knowing yourself
        - Yesterday and tomorrow
        - Learning and forgetting
      answer: 0
      feedback: 知人 points to knowing other people. 自知 points to knowing yourself. English translations such as “wisdom” and “clarity” help us notice the contrast without claiming there is only one interpretation.
  reflection: Think of something you understand about another person, and something you are still learning about yourself. You may write a thought or a question in English.
