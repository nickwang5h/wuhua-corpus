    version: "1"
    start: 178
    end: 193
    text: 我 (wǒ) means “I” or “me”, and 与 (yǔ) means “with”; 万物 (wàn wù) means all the many things in the world. 为 (wéi) is read wéi here in 为一, “form one”, rather than wèi, “for”.
